<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,0.4);">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="stream-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.06); }
    }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }
    @keyframes dashTravel {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes badgeShimmer {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }
    .pulsing-orb-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulsing-orb-2 {
      animation: pulseGlow 9s ease-in-out infinite alternate;
      transform-origin: 1000px 240px;
    }
    .floating-card {
      animation: floatOrb 6s ease-in-out infinite alternate;
    }
    .stream-line {
      stroke-dasharray: 12, 16;
      animation: dashTravel 8s linear infinite;
    }
    .shimmer-badge {
      animation: badgeShimmer 4s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.8px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>

  <!-- Background Decorative Glowing Orbs -->
  <circle class="pulsing-orb-1" cx="180" cy="90" r="140" fill="url(#accent-cyan)" filter="url(#soft-glow)"/>
  <circle class="pulsing-orb-2" cx="1020" cy="260" r="160" fill="url(#glow-purple)" filter="url(#soft-glow)"/>

  <!-- Digital Grid & Connectivity Waves in Background -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Dynamic Data Stream Wave (Stays behind foreground elements) -->
  <path class="stream-line" d="M -50 290 Q 250 200, 550 280 T 1250 210" fill="none" stroke="url(#primary-grad)" stroke-width="2.5" opacity="0.45"/>
  <path class="stream-line" d="M -50 310 Q 300 240, 650 310 T 1250 250" fill="none" stroke="url(#accent-cyan)" stroke-width="1.8" opacity="0.35" style="animation-duration: 12s;"/>

  <!-- Dynamic Floating Decorative Tech Pill (Right side background element) -->
  <g class="floating-card" opacity="0.85">
    <rect x="940" y="45" width="200" height="68" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="965" cy="79" r="6" fill="#10b981"/>
    <text x="982" y="74" fill="#94a3b8" class="badge-text" font-size="11">PREDICTIVE SCORE</text>
    <text x="982" y="93" fill="#38bdf8" class="badge-text" font-size="16" font-weight="700">98.4 / 100 • A1</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Title, Subtitle, and Feature Tags -->
  <!-- Top Super-header Category Badge -->
  <g class="shimmer-badge">
    <rect x="60" y="42" width="245" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="75" cy="57" r="4" fill="#38bdf8"/>
    <text x="88" y="62" fill="#bae6fd" class="badge-text" font-size="12" letter-spacing="0.5">REVENUE INTELLIGENCE &amp; AI</text>
  </g>

  <!-- Main Hero Title -->
  <text x="60" y="128" fill="url(#primary-grad)" class="title-text" font-size="44" filter="url(#glow)">Predictive Lead Scoring</text>
  <text x="60" y="174" fill="#ffffff" class="title-text" font-size="35">&amp; Qualification Ecosystem</text>

  <!-- Subtitle Explainer -->
  <text x="60" y="218" fill="#94a3b8" class="subtitle-text" font-size="17">
    Curated Hub of SaaS Platforms, Behavioral Signal Detection &amp; Self-Hosted ML Scoring Engines
  </text>

  <!-- Modern Feature Tags (Foreground Pills) -->
  <g transform="translate(60, 252)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
      <text x="24" y="24" fill="#38bdf8" class="badge-text">⚡ ML Lead Prioritization</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="190" height="38" rx="19" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.95"/>
      <text x="22" y="24" fill="#818cf8" class="badge-text">🎯 Buyer Intent &amp; Signals</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(400, 0)">
      <rect width="185" height="38" rx="19" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" opacity="0.95"/>
      <text x="24" y="24" fill="#c084fc" class="badge-text">🛠️ Open-Source Engines</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(600, 0)">
      <rect width="175" height="38" rx="19" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.95"/>
      <text x="24" y="24" fill="#34d399" class="badge-text">📊 Real-Time B2B Scoring</text>
    </g>
  </g>
</svg>
